# firstmate's declared incorporation inventory.
#
# One stanza per thing firstmate incorporates. DECLARED, not inferred: a
# dependency added to bin/fm-bootstrap.sh's TOOLS without a stanza here is a
# red test (tests/fm-deps.test.sh) and a DEPS: line at session start, because
# inference from command names always lags reality and misses the piece nobody
# remembered.
#
# Format and field semantics are owned by bin/fm-deps-lib.sh's header; the
# operator-facing story is docs/dependency-currency.md. In short:
#
#   [<id>]                 the command name firstmate invokes
#   kind      = npm | binary | system
#   purpose   = one line: what it is for
#   relies-on = one line: what firstmate relies on it to DO (the thing a
#               silent upgrade can take away)
#   currency  = npm:<pkg> | none: <reason currency cannot be established>
#   sibling   = <projects/ dir>   optional: the captain's own clone, compared
#               locally so a repo that has moved past its published release is
#               visible without a network call
#   contract  = pinned | none: <reason this one does not deserve a pinned contract>
#   control     = captain | third-party[:<who>] | vendor:<who> | system: <reason>
#   write-access = yes|none|unknown: <how it was VERIFIED, and when>
#   fallback    = direct|upstream-and-wait|own-build-of-fork|vendor|drop-and-degrade: <why>
#   degrades-to = one line: what breaks if this is wrong or absent
#   provenance  = published | local-build: <what we run instead, and why>
#   repo        = <owner>/<name>, what `bin/fm-deps.sh access-check` queries
#
# The ownership block exists because "is it current" is not the only question a
# dependency can fail. A dependency nobody can land a fix in is a different risk,
# it is knowable in advance rather than at the moment a fix is needed, and the
# rung of the fallback ladder we would climb should be a recorded decision rather
# than a reflex. `write-access` records how it was CHECKED, because it was
# assumed for a long time and the assumption cost a merged fix.
#
# `contract = none:` REQUIRES a reason. Deciding not to pin is a legitimate,
# frequently correct call - but it is a decision, and it is recorded here where
# review can see it, not left as an unexamined gap.

[quota-axi]
kind      = npm
purpose   = per-provider usage evidence for usage-burndown dispatch and provider admission
relies-on = the `quota-axi --json` provider/window document that bin/fm-usage-source-lib.sh parses
currency  = npm:quota-axi
sibling   = quota-axi
contract  = pinned
control      = third-party:kunchenguid
repo         = kunchenguid/quota-axi
write-access = none: verified 2026-07-25 - neither captain account has push on kunchenguid/quota-axi (admin/maintain/push all false). Upstream is actively maintained with near-daily releases, but across the last 20 pull requests every merged one came from the maintainer or the release bot and every outside contributor's PR is unmerged, firstmate's #43 among them
fallback     = own-build-of-fork: only while a needed fix is actually blocked. This tool sits in the routing critical path and the fix for it cannot be landed upstream, so this home runs its own build and keeps #43 open. Not a permanent fork: these tools reverse-engineer six vendors' billing APIs including protobuf decoding, and owning that indefinitely is a larger maintenance burden than the problem it solves
degrades-to  = routing accuracy, not function. With no usable usage evidence, bin/fm-dispatch-select.sh retains the selected profile with quota_posture=unknown rather than switching provider, so a wrong or absent quota-axi costs dispatch quality and never blocks work
provenance   = local-build: packed from the captain's fork carrying the unmerged grok window-id fix and installed 2026-07-25. It reports 0.1.13, the same string as the published release, while containing different code - which is why identity is checked by artifact reading and not by version string

[tasks-axi]
kind      = npm
purpose   = backlog backend verbs for data/backlog.md
relies-on = the version floor and the update/mv flags bin/fm-tasks-axi-lib.sh probes for
currency  = npm:tasks-axi
contract  = none: already owned. bin/fm-tasks-axi-lib.sh's fm_tasks_axi_compatible probes the floor and both flags at runtime because it also gates backend selection, and bootstrap reports the verdict as MISSING: tasks-axi. A second pin here would give one fact two owners and report it twice
control      = third-party:kunchenguid
repo         = kunchenguid/tasks-axi
write-access = none: verified 2026-07-25 - same publisher and same access as quota-axi; no captain account has push
fallback     = upstream-and-wait: the backlog backend already has a first-class degraded mode (config/backlog-backend=manual, and an incompatible build falls back to hand-editing data/backlog.md), so a blocked fix costs convenience rather than capability and does not justify a fork
degrades-to  = backlog mutation falls back to hand-editing data/backlog.md in the format section 10 of AGENTS.md defines; nothing is lost, it is slower
provenance   = published

[treehouse]
kind      = binary
purpose   = pooled clean task worktrees for crewmate spawns
relies-on = `treehouse get --lease` durable lease support
currency  = none: distributed by an install script with no version registry to query, so staleness cannot be established from outside
contract  = none: already owned. bin/fm-bootstrap.sh's treehouse_supports_lease probes the one behavior firstmate relies on every session and reports it as MISSING: treehouse; re-pinning it here would double-report the same fact
control      = third-party:kunchenguid
repo         = kunchenguid/treehouse
write-access = none: verified 2026-07-25 - same publisher and same access as the -axi family; no captain account has push
fallback     = drop-and-degrade: crewmates can be spawned into a plain git worktree without the pool, so a blocked fix costs the pooling optimization rather than the ability to dispatch
degrades-to  = no pooled clean worktrees; spawns need a worktree provisioned another way, and the isolation guarantee bin/fm-spawn.sh asserts must still hold
provenance   = published

[no-mistakes]
kind      = binary
purpose   = the validation pipeline crewmates drive before a PR
relies-on = the `axi status` run/step vocabulary bin/fm-crew-state.sh reads to judge a validating crewmate (the version floor is separately owned by bin/fm-bootstrap.sh)
currency  = none: built from an authenticated private checkout, not a public registry
sibling   = no-mistakes
contract  = pinned
control      = captain
repo         = GRyndStone/no-mistakes
write-access = yes: verified 2026-07-25 - the captain's own private repository, built from projects/no-mistakes
fallback     = direct: the captain owns it, so a needed fix lands there directly and no ladder is needed
degrades-to  = no-mistakes-mode projects lose their validation pipeline; direct-PR and local-only projects are unaffected, and bin/fm-crew-state.sh falls back to pane liveness for judging a validating crewmate
provenance   = published

[gh-axi]
kind      = npm
purpose   = every GitHub operation firstmate and its crewmates perform
relies-on = its own session hooks and --help to describe the current surface
currency  = npm:gh-axi
contract  = none: AGENTS.md section 3 deliberately forbids memorizing these flags - the tool's session hook and --help are declared the source of truth, so a pinned flag list here would be a second owner of a contract firstmate has decided not to hold
control      = third-party:kunchenguid
repo         = kunchenguid/gh-axi
write-access = none: verified 2026-07-25 - same publisher and same access as the rest of the -axi family; no captain account has push
fallback     = upstream-and-wait: not in a critical path, and the degraded mode below is acceptable, so a blocked fix does not justify carrying a fork
degrades-to  = every GitHub operation loses its ergonomic wrapper; the underlying gh CLI remains, so PR and merge flows are recoverable by hand
provenance   = published

[chrome-devtools-axi]
kind      = npm
purpose   = every browser operation firstmate and its crewmates perform
relies-on = its own session hooks and --help to describe the current surface
currency  = npm:chrome-devtools-axi
contract  = none: same declared no-memorized-flags rule as gh-axi
control      = third-party:kunchenguid
repo         = kunchenguid/chrome-devtools-axi
write-access = none: verified 2026-07-25 - same publisher and same access as the rest of the -axi family; no captain account has push
fallback     = upstream-and-wait: not in a critical path, and the degraded mode below is acceptable, so a blocked fix does not justify carrying a fork
degrades-to  = browser operations lose their wrapper; browser-dependent tasks stall rather than producing wrong results
provenance   = published

[lavish-axi]
kind      = npm
purpose   = rich review surfaces for multi-option decisions and structured reports
relies-on = its own session hooks and --help to describe the current surface
currency  = npm:lavish-axi
contract  = none: same declared no-memorized-flags rule as gh-axi
control      = third-party:kunchenguid
repo         = kunchenguid/lavish-axi
write-access = none: verified 2026-07-25 - same publisher and same access as the rest of the -axi family; no captain account has push
fallback     = upstream-and-wait: not in a critical path, and the degraded mode below is acceptable, so a blocked fix does not justify carrying a fork
degrades-to  = rich review surfaces are unavailable; decisions fall back to plain chat, which section 9 of AGENTS.md already allows
provenance   = published

[tmux]
kind      = system
purpose   = the verified reference runtime backend for crewmate endpoints
relies-on = session/window/pane semantics already covered by the tmux backend suite
currency  = none: a system package on the operator's own upgrade cadence, not firstmate's to track
contract  = none: tests/fm-backend-tmux-smoke.test.sh already exercises the exact surface bin/backends/tmux.sh uses against the real binary, which is a stronger check than a pinned flag list and would be a duplicate owner of it

[orca]
kind      = binary
purpose   = the runtime backend for crewmate endpoints when the orca profile is selected
relies-on = the worktree/terminal ids bin/backends/orca.sh records and reconciles against
currency  = none: an application distributed outside any registry firstmate can query
contract  = none: tests/fm-backend-orca.test.sh covers the adapter surface, and the profile is opt-in - a pinned contract would be probed on every home including the ones that never select orca
control      = third-party
write-access = unknown: not verified - orca is an opt-in experimental backend this home does not select, so the check has not been run
fallback     = drop-and-degrade: the backend is opt-in and tmux is the verified reference, so a blocked fix means staying on tmux
degrades-to  = the orca backend profile is unavailable; every other backend, including the tmux default, is unaffected

[herdr]
kind      = binary
purpose   = the runtime backend for crewmate endpoints when herdr is selected or auto-detected, including the home this fleet currently runs in
relies-on = the workspace, tab, and pane surface bin/backends/herdr.sh drives and parses, documented in docs/herdr-backend.md
currency  = brew:herdr
contract  = none: already owned. tests/fm-backend-herdr.test.sh and the herdr smoke suites exercise the exact adapter surface against the real binary, which is a stronger check than a pinned flag list and would be a second owner of it
control      = third-party:herdr.dev
repo         = Homebrew/homebrew-core (formula); upstream https://herdr.dev
write-access = unknown: not verified - the adapter surface is covered by its own suites and no fix has been needed, so the access check has not been run against upstream
fallback     = drop-and-degrade: tmux is the verified reference backend and remains selectable, so a blocked fix means moving this home back to tmux rather than owning a terminal multiplexer
degrades-to  = the herdr backend profile; a home running on herdr would have to move to tmux, and every other backend is unaffected

[git]
kind      = system
purpose   = every repository operation across the fleet
relies-on = plumbing and porcelain that has been stable for a decade
currency  = none: a system package on the operator's own upgrade cadence
contract  = none: the surface used is long-stable and already exercised by nearly every test in tests/; pinning it would be maintenance with no realistic breakage to catch

[gh]
kind      = system
purpose   = GitHub authentication that gh-axi and the PR helpers depend on
relies-on = `gh auth status` reflecting a usable credential
currency  = none: a system package on the operator's own upgrade cadence
contract  = none: bootstrap's existing NEEDS_GH_AUTH probe already checks the one behavior firstmate relies on, and duplicating it here would create a second owner

[node]
kind      = system
purpose   = the runtime every *-axi tool and .mjs policy script executes on
relies-on = a working modern Node runtime
currency  = none: a system package on the operator's own upgrade cadence
contract  = none: no firstmate-specific surface to pin beyond "the tools it hosts run", which their own contracts already assert
